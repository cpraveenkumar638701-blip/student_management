[build]
  # The React app lives in the my-app/ subdirectory
  base = "my-app"
  # CI=false keeps Create React App from treating lint warnings as build errors
  # Install the app's dependencies first so react-scripts is always available
  command = "npm install && CI=false npm run build"
  # Relative to the base directory
  publish = "build"

# Single-page app fallback so React Router routes work on refresh/direct links
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
